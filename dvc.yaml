stages:
  plot-raw:
    cmd: calkit xenv -n py --no-check -- python scripts/plot-raw.py
    deps:
      - scripts/plot-raw.py
      - data/raw.csv
      - uv.lock
    outs:
      - figures/raw.png
    desc: Automatically generated from the 'plot-raw' stage in calkit.yaml.
      Changes made here will be overwritten.
  fade:
    cmd: calkit nb execute --environment py --no-check --to html --output
      "kind=figure,cell_id=plot,variable_name=fig,output_path=figures/absorbance.pdf"
      --output "kind=value,cell_id=later,variable_name=k899" --output
      "kind=figure,cell_id=arrhenius,output_path=figures/ln_k.png"
      "notebooks/fade.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebooks/fade.ipynb
      - data/decay.csv
      - uv.lock
    outs:
      - .calkit/notebooks/executed/notebooks/fade.ipynb:
          cache: true
      - .calkit/notebooks/html/notebooks/fade.html:
          cache: true
      - .calkit/notebooks/outputs/notebooks/fade.ipynb/values.json:
          cache: false
      - figures/absorbance.pdf:
          cache: true
      - figures/ln_k.png:
          cache: true
    desc: Automatically generated from the 'fade' stage in calkit.yaml. Changes
      made here will be overwritten.
  main:
    cmd: calkit latex build -e latex --no-check main.tex
    deps:
      - main.tex
      - frog.jpg
      - sample.bib
      - calkit.sty
      - .calkit/env-locks/latex.json
      - figures/ln_k.png
      - .calkit/notebooks/outputs/notebooks/fade.ipynb/values.json
      - _calkit/values.tex
    outs:
      - main.pdf
    desc: Automatically generated from the 'main' stage in calkit.yaml. Changes
      made here will be overwritten.
