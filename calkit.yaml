datasets:
  - path: data/raw.csv
    title: The raw data
    description: I collected this myself.
    created_by:
      - email: petebachant@gmail.com
        name: Pete Bachant
environments:
  py:
    kind: uv
    path: pyproject.toml
  latex:
    kind: texlive
    release: 2025
    description: TeX Live, installed by Calkit.
pipeline:
  stages:
    plot-raw:
      kind: python-script
      script_path: scripts/plot-raw.py
      environment: py
      inputs:
        - data/raw.csv
      outputs:
        - figures/raw.png
    fade:
      kind: jupyter-notebook
      environment: py
      inputs:
        - data/decay.csv
      notebook_path: notebooks/fade.ipynb
      cleaned_ipynb_storage: git
      cell_outputs:
        - kind: figure
          cell_id: plot
          variable_name: fig
          output_path: figures/absorbance.pdf
        - kind: value
          cell_id: later
          variable_name: k899
    main:
      kind: latex
      target_path: main.tex
      pdf_storage: dvc
      environment: latex
      inputs:
        - frog.jpg
        - sample.bib
figures:
  - path: figures/raw.png
    title: Raw
    stage: plot-raw
  - path: frog.jpg
    imported_from:
      description: overleaf.com
git_repo_url: https://github.com/petebachant/test-11
owner: petebachant
name: test-11
hub: localhost
